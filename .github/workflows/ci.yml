name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      # The password and the credential hold every character the shell or
      # systemd could misread.
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env: &secrets
          TF_VAR_password: ci-only p$a"ss`w\o'rd
          TF_VAR_environment: '{ TRICKY = "a$b\"c`d\\e''f" }'
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The password and environment reach the host write-only, so state holds
      # none of them, and nothing Conn3x writes under .terraform does either.
      # State is JSON, which would escape their quotes and backslashes, so it
      # looks for pieces of each that JSON leaves as they are.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          # shellcheck disable=SC2016 # the $ and ` are meant literally
          if grep -rqF --exclude-dir=modules -e 'ci-only p$a' -e 'ss`w' -e 'c`d' terraform.tfstate .terraform/; then
            echo "The password or an environment value is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # Starts the backup unit the timer would, restores a file from the
      # snapshot and compares it, then checks the retention policy forgot a
      # snapshot and restic check passes.
      - name: Back up, restore and forget
        run: |
          podman exec -i circuit-restic sh -eu <<'EOF'
          systemctl is-active conn3x-restic-backup.timer conn3x-restic-check.timer
          systemctl show -p RandomizedDelayUSec conn3x-restic-backup.timer | grep -qx 'RandomizedDelayUSec=30min'
          echo "marker $(date +%s%N)" > /root/marker
          systemctl start conn3x-restic-backup.service
          n() { conn3x-restic snapshots --json | grep -o '"short_id"' | wc -l; }
          [ "$(n)" -eq 1 ]
          rm -rf /tmp/restore
          conn3x-restic restore latest --target /tmp/restore --include /root/marker
          diff /root/marker /tmp/restore/root/marker
          # keep_daily keeps the day's newest snapshot, and restic also keeps
          # the oldest while the policy has days to fill, so a third run on
          # the same day forgets the second.
          systemctl start conn3x-restic-backup.service
          systemctl start conn3x-restic-backup.service
          conn3x-restic snapshots --compact
          [ "$(n)" -eq 2 ]
          journalctl -u conn3x-restic-backup.service --no-pager | grep 'remove 1 snapshots'
          systemctl start conn3x-restic-check.service
          EOF
      - name: Check the credential reads the same to sh and systemd
        run: |
          podman exec -i circuit-restic sh -eu <<'EOF'
          . /etc/conn3x-restic/environment
          [ "$TRICKY" = 'a$b"c`d\e'"'"'f' ]
          [ "$(systemd-run --wait --pipe -q -p EnvironmentFile=/etc/conn3x-restic/environment printenv TRICKY)" = "$TRICKY" ]
          EOF
      # Restarting the container boots systemd again, so this checks both
      # timers come back enabled and a backup still runs and checks out.
      - name: Restart the host, then back up again and plan with no changes
        working-directory: examples/local
        env: *secrets
        run: |
          podman restart circuit-restic
          podman exec circuit-restic timeout 60 systemctl is-system-running --wait || true
          podman exec -i circuit-restic sh -eu <<'EOF'
          systemctl is-active conn3x-restic-backup.timer conn3x-restic-check.timer
          echo "after restart $(date +%s%N)" > /root/marker
          systemctl start conn3x-restic-backup.service
          rm -rf /tmp/restore
          conn3x-restic restore latest --target /tmp/restore --include /root/marker
          diff /root/marker /tmp/restore/root/marker
          systemctl start conn3x-restic-check.service
          EOF
          conn3x plan -detailed-exitcode
      # A fresh host gets restic 0.19.0 and a first snapshot, then the
      # circuit's own pin is applied over it, the way someone moves to a new
      # release of this circuit. The new restic has to restore the old
      # snapshot and pass restic check on the old repository.
      - name: Upgrade from restic 0.19.0 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env: *secrets
        run: |
          ./down.sh
          CONTAINERFILE="$GITHUB_WORKSPACE/conn3x/test/images/${{ matrix.distro }}/Containerfile" ./up.sh
          conn3x init
          conn3x apply -auto-approve -var restic_version=0.19.0 \
            -var 'checksums={x86_64="13176fe6d89d4357947a2cd107218ab2873a5f9d8e1ac2d4cd1c8e07e6839c21",aarch64="e522ce6bf748d753fee8093e8ec59359972cf5b6bc65fc7c7cf38ae952351d91"}'
          podman exec circuit-restic sh -euc 'restic version | grep -F "restic 0.19.0 "; echo "before $(date +%s%N)" > /root/before-upgrade; systemctl start conn3x-restic-backup.service'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          want=$(sed -n '/^variable "restic_version"/,/^}/s/^ *default *= *"\(.*\)"/\1/p' ../../variables.tf)
          podman exec -i circuit-restic sh -eu -s "$want" <<'EOF'
          restic version | grep -F "restic $1 "
          rm -rf /tmp/restore
          conn3x-restic restore latest --target /tmp/restore --include /root/before-upgrade
          diff /root/before-upgrade /tmp/restore/root/before-upgrade
          systemctl start conn3x-restic-check.service
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
